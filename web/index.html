<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <script>
    // High-performance Mobile WebGL optimization:
    // On mobile devices with ultra-high Retina DPI (>= 2.0x), clamp devicePixelRatio to 1.5.
    // This slashes the fragment shader pixel fill-rate by 44% to 75% without reducing visual sharpness or altering aspect ratio.
    (function() {
      try {
        var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        if (isMobile && window.devicePixelRatio > 1.5) {
          var clampedDpr = 1.5;
          Object.defineProperty(window, 'devicePixelRatio', {
            get: function() { return clampedDpr; },
            configurable: true
          });
        }
      } catch (e) {
        console.warn('DPR clamp not supported', e);
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Live 1v1 arcade games in your browser: Hoops, Archery and more. Challenge a friend, no download.">
  <meta name="theme-color" content="#0A0E1A">

  <!-- Open Graph / WhatsApp / iMessage / Social Previews -->

  <meta property="og:description" content="Live 1v1 arcade games in your browser: Hoops, Archery and more. Challenge a friend, no download.">

  <!-- Twitter / Discord Previews -->

  <meta name="twitter:description" content="Live 1v1 arcade games in your browser: Hoops, Archery and more. Challenge a friend, no download.">
  <meta name="twitter:image" content="icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <!-- Favicon & Preload Splash Icon -->
  <link rel="preload" as="image" href="icons/Icon-180.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"/>

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #0A0E1A;
      margin: 0;
      padding: 0;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Fast, Clean App Icon Splash */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #0A0E1A;
      z-index: 999999;
      opacity: 1;
      transition: opacity 0.35s ease-out;
      pointer-events: auto;
    }

    #splash-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* Responsive App Icon - properly fitted with smooth iOS continuous curve */
    .splash-icon {
      width: min(108px, 24vw);
      height: min(108px, 24vw);
      object-fit: cover;
      border-radius: 24%;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 255, 204, 0.18);
      animation: gentlePulse 1.8s infinite ease-in-out;
    }

    @keyframes gentlePulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.95;
      }
      50% {
        transform: scale(1.04);
        opacity: 1;
      }
    }

    /*
    --- COMMENTED OUT: Animated bouncing ball and title splash ---
    .ball {
      width: 60px;
      height: 60px;
      background: radial-gradient(circle at 35% 35%, #ff7733, #b83a00);
      border-radius: 50%;
      animation: bounce 0.6s infinite alternate ease-in;
      box-shadow: inset -4px -4px 10px rgba(0,0,0,0.5);
    }
    .shadow {
      width: 50px;
      height: 12px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 50%;
      animation: scaleShadow 0.6s infinite alternate ease-in;
      margin-top: 15px;
    }
    .title {
      color: #ffffff;
      font-weight: 800;
      letter-spacing: 4px;
      margin-top: 25px;
      font-size: 1.1rem;
      opacity: 0.8;
    }
    */
  </style>
</head>
<body>
  <!-- Clean App Icon Splash -->
  <div id="splash-screen">
    <img class="splash-icon" src="icons/Icon-180.png" alt="GameVerse" />
  </div>

  <script>
    // Smoothly dismiss splash screen as soon as Flutter renders the first frame
    window.addEventListener('flutter-first-frame', function () {
      const splash = document.getElementById('splash-screen');
      if (splash) {
        splash.classList.add('fade-out');
        setTimeout(() => splash.remove(), 360);
      }
    });

    // Safety fallback
    window.addEventListener('load', function () {
      setTimeout(function () {
        const splash = document.getElementById('splash-screen');
        if (splash && !splash.classList.contains('fade-out')) {
          splash.classList.add('fade-out');
          setTimeout(() => splash.remove(), 360);
        }
      }, 5000);
    });
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    Lagos Life / Vatar Games SDK Bridge (non-blocking).

    The SDK is only needed when DunkVerse runs inside the Lagos Life in-game
    phone frame (an iframe — see `frame-ancestors` in firebase.json). It is
    injected asynchronously so a slow or offline lagoslife.app can never hold
    up Flutter's boot. `window.__vatarSdkReady` resolves to true once
    `window.Vatar` exists, or false (not framed / load error / 3s timeout);
    VatarBridge.init() in Dart awaits it before deciding standalone vs embedded.
    A plain `defer` is not enough: flutter_bootstrap.js is `async` and could
    run before a deferred script, making Dart miss `window.Vatar`.
  -->
  <script>
    (function () {
      var isFramed = false;
      try { isFramed = window.self !== window.top; } catch (e) { isFramed = true; }
      window.__vatarSdkReady = new Promise(function (resolve) {
        if (!isFramed) { resolve(false); return; }
        var settled = false;
        function done(ok) { if (!settled) { settled = true; resolve(ok); } }
        var s = document.createElement('script');
        s.src = 'https://lagoslife.app/sdk/vatar-games-v1.js';
        s.async = true;
        s.onload = function () { done(!!window.Vatar); };
        s.onerror = function () { done(false); };
        setTimeout(function () { done(!!window.Vatar); }, 3000);
        document.head.appendChild(s);
      });
    })();
  </script>
  <!--
    Audio on web uses the browser's own audio (Web Audio + an <audio> element,
    see lib/game/audio/audio_backend_web.dart). The SoLoud WASM loader
    (init_soloud.js) is intentionally NOT included: it downloaded a large WASM
    module on every visit and mixed audio on the page's main thread.
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
