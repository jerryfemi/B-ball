name: Build & Deploy Web (Firebase Hosting)

# Every push to main builds the Flutter web release and deploys it to
# Firebase Hosting (site "dunkverse" in firebase.json). Hosting only:
# Firestore rules and indexes are never touched by this workflow.
on:
  push:
    branches:
      - main
  workflow_dispatch: # manual "Run workflow" button in the Actions tab

# One deploy at a time; a newer push cancels an older run still in progress.
concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_PROJECT_ID: game-arcade-bball

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web (release)
        run: flutter build web --release

      - name: Setup Node (for Firebase CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
